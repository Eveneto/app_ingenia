name: Build iOS and Android

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Build iOS Simulator
        run: |
          cd ios
          xcodebuild \
            -workspace AppIngenia.xcworkspace \
            -scheme AppIngenia \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            build \
            CODE_SIGNING_ALLOWED=NO

      - name: Check Apple signing secrets
        id: signing
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          if [ -n "$CERTIFICATE_P12" ] && [ -n "$CERTIFICATE_PASSWORD" ] && [ -n "$PROVISIONING_PROFILE" ] && [ -n "$TEAM_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Apple Certificate and Provisioning Profile
        if: steps.signing.outputs.enabled == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          echo "$CERTIFICATE_P12" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Archive iOS
        if: steps.signing.outputs.enabled == 'true'
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          cd ios
          xcodebuild \
            -workspace AppIngenia.xcworkspace \
            -scheme AppIngenia \
            -configuration Release \
            -archivePath AppIngenia.xcarchive \
            archive \
            DEVELOPMENT_TEAM="$TEAM_ID"

      - name: Export IPA
        if: steps.signing.outputs.enabled == 'true'
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          cd ios
          sed -i '' "s/TEAM_ID/${TEAM_ID}/" exportOptions.plist
          xcodebuild -exportArchive -archivePath AppIngenia.xcarchive -exportOptionsPlist exportOptions.plist -exportPath .

      - name: Upload IPA
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AppIngenia-iOS
          path: ios/AppIngenia.ipa

  build-android:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.java.home=$JAVA_HOME
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Setup Java
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        env:
          GRADLE_OPTS: -Dorg.gradle.java.home=${{ steps.setup-java.outputs.path }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppIngenia-Android
          path: android/app/build/outputs/apk/release/app-release.apk
